name: Export dotenvx envs
description: Decrypt dotenvx env values into step outputs and job env
author: kentrino

branding:
  icon: unlock
  color: green

inputs:
  private_key:
    description: dotenvx private key used to decrypt the env file
    required: true
  file:
    description: Path to the dotenvx env file to decrypt
    required: true
  keys:
    description: Newline-separated names to export, or "*" for all
    required: true

runs:
  using: node24
  main: dist/index.js
