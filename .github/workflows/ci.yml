name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # throwaway fixture key; not a real secret
      DOTENV_PRIVATE_KEY_CI: dc08409876f6c2da7e5123380b071b131977ffbf2aadb78945e1579514dbae4b
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run ready

      - name: Check committed dist is up to date
        run: git diff --exit-code -- dist

      - name: Export named keys
        id: dotenv
        uses: ./
        with:
          private_key: ${{ env.DOTENV_PRIVATE_KEY_CI }}
          file: fixtures/.env.ci
          keys: |
            HELLO
            PLAIN

      - name: Check named keys
        run: |
          test "$HELLO" = "hello-from-ci"
          test "$PLAIN" = "visible"
          test "${{ steps.dotenv.outputs.HELLO }}" = "hello-from-ci"
          test "${{ steps.dotenv.outputs.PLAIN }}" = "visible"
          if [ -n "${EXTRA+x}" ]; then
            echo "EXTRA should not be exported for named keys" >&2
            exit 1
          fi

      - name: Export all keys
        uses: ./
        with:
          private_key: ${{ env.DOTENV_PRIVATE_KEY_CI }}
          file: fixtures/.env.ci
          keys: "*"

      - name: Check all keys
        run: |
          test "$HELLO" = "hello-from-ci"
          test "$EXTRA" = "should-not-leak"
          test "$PLAIN" = "visible"
          if [ -n "${DOTENV_PUBLIC_KEY_CI+x}" ]; then
            echo "DOTENV_PUBLIC_KEY_CI should not be exported for keys: '*'" >&2
            exit 1
          fi
