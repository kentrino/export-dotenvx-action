name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: Update major and minor tags
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f "v${{ steps.release.outputs.major }}"
          git tag -f "v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin "v${{ steps.release.outputs.major }}" --force
          git push origin "v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}" --force
